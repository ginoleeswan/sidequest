name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # A hung step otherwise sits on the runner for six hours before
    # GitHub kills it, and reads as "still running" the whole time.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Test
        run: npm test
        timeout-minutes: 8
      - name: Bundle (web export)
        run: npx expo export --platform web
        timeout-minutes: 10
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        timeout-minutes: 6
      - name: Hydration check
        run: npm run test:hydration
        timeout-minutes: 8
      - name: Accessibility check
        run: npm run test:a11y
        timeout-minutes: 8
      - name: Icon subset check
        run: npm run test:icons
        timeout-minutes: 5
      - name: Performance budgets
        run: npm run test:perf
        timeout-minutes: 8
